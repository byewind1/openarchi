name: Verify and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify public source
        run: python scripts/verify.py
      - name: Clippy diagnostics
        run: cargo clippy --locked --all-targets
      - name: Build release with remapped paths
        run: python scripts/build-release.py --target ${{ matrix.target }}
      - name: Assemble allowlisted package
        run: python scripts/package.py --target ${{ matrix.target }}
      - name: Scan final package
        run: python scripts/audit-package.py dist
      - name: Run packaged native window
        shell: bash
        run: python scripts/native-smoke.py dist/OpenArchi-0.2.0-*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: OpenArchi-${{ matrix.target }}
          path: |
            dist/OpenArchi-0.2.0-*.zip
            dist/*.sha256
            dist/native-*.json
          if-no-files-found: error
