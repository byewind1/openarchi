[package]
name = "atelier-bim"
version = "0.1.0"
edition = "2024"
default-run = "openarchi"
rust-version = "1.95"
description = "OpenArchi native architectural design workbench"
license = "Apache-2.0"

[package.metadata.openarchi]
product-name = "OpenArchi"
version-display = "0.1"

[[bin]]
name = "openarchi"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
geo = { version = "=0.33.1", default-features = false, features = ["earcut"] }

# Native macOS menu bar. Versions match what eframe/rfd already pin in
# Cargo.lock (objc2 0.6.5 / objc2-app-kit 0.3.2 / objc2-foundation 0.3.2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSObject"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "none"
