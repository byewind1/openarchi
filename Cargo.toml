[package]
name = "atelier-bim"
version = "0.2.0"
edition = "2024"
default-run = "openarchi"
rust-version = "1.95"
description = "OpenArchi native architectural design workbench"
license = "Apache-2.0"

[package.metadata.openarchi]
product-name = "OpenArchi"
version-display = "0.2.0"

[[bin]]
name = "openarchi"
path = "src/main.rs"

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
rfd = "0.15"
geo = { version = "=0.33.1", default-features = false, features = ["earcut"] }
# Same coordinate adapter used by geo 0.33.1 / i_overlay; keep membership on its grid.
i_float = "=1.16.0"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
sha2 = "=0.10.9"
schemars = "=1.2.3"
libc = "=0.2.190"
calamine = { version = "=0.38.0", default-features = false }
csv = "=1.4.0"
encoding_rs = "=0.8.44"
zip = { version = "=9.0.0", default-features = false, features = ["deflate"] }
quick-xml = "=0.42.0"
roxmltree = "=0.21.1"
rstar = "=0.12.2"
scraper = { version = "=0.29.0", default-features = false }

# Native macOS menu bar. Versions match what eframe/rfd already pin in
# Cargo.lock (objc2 0.6.5 / objc2-app-kit 0.3.2 / objc2-foundation 0.3.2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", features = [
    "NSApplication",
    "NSEvent",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
] }
objc2-foundation = { version = "0.3.2", features = ["NSString", "NSObject"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
strip = "debuginfo"

# Backport the upstream KVO teardown fix without upgrading the native UI stack.
[patch.crates-io]
accesskit_macos = { path = "vendor/accesskit_macos" }
